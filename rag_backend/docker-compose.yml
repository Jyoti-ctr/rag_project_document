services:
  mongo:
    image: mongo:7
    container_name: rag_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: rag_backend
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-CHANGE_ME_SUPER_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      EMBEDDING_MODEL_NAME: all-MiniLM-L6-v2
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL_NAME: llama-3.1-8b-instant
      CHUNK_SIZE: 500
      CHUNK_OVERLAP: 50
      TOP_K_CHUNKS: 3
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
